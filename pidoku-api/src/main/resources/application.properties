spring.application.name=pidoku-api

# Local dev: load DATABASE_URL etc. from pidoku-api/.env if it exists (gitignored).
# In Cloud Run these come from real environment variables / Secret Manager.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Neon free tier: keep the pool small and use the pooled (-pooler) connection string.
spring.datasource.hikari.maximum-pool-size=5

# Flyway owns the schema; Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Generator job (runs with the "generator" profile, see GeneratorJob) ---
pidoku.generator.pool-size-per-difficulty=50
pidoku.generator.daily-days-ahead=31
# 0 = one puzzle at a time per available processor.
pidoku.generator.parallelism=0
pidoku.generator.timeout=60s

# --- Daily puzzles: one of each of these difficulties every day (UTC) ---
pidoku.daily.difficulties=easy,medium,hard

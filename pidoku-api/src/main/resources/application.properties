spring.application.name=pidoku-api

# Local dev: load DATABASE_URL etc. from pidoku-api/.env if it exists (gitignored).
# In Cloud Run these come from real environment variables / Secret Manager.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Neon free tier: keep the pool small and use the pooled (-pooler) connection string.
spring.datasource.hikari.maximum-pool-size=5

# Flyway migrates over Neon's direct connection (the same host without -pooler). Its migration lock
# needs one connection for the whole migration, and the pooler only lends a connection for a single
# transaction. Everything else uses the pooled DATABASE_URL above. Falls back to DATABASE_URL if
# DATABASE_DIRECT_URL isn't set.
spring.flyway.url=${DATABASE_DIRECT_URL:${DATABASE_URL}}
spring.flyway.user=${DATABASE_USER}
spring.flyway.password=${DATABASE_PASSWORD}

# Flyway owns the schema; Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Sign-in: players send a Firebase ID token (anonymous sign-in), a JWT signed by Google ---
# Spring Security checks the signature against Google's public keys (fetched on the first token and
# cached), the expiry, that the issuer is this Firebase project and that the audience is its id.
pidoku.firebase.project-id=pidoku
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://www.googleapis.com/service_accounts/v1/jwk/securetoken@system.gserviceaccount.com
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://securetoken.google.com/${pidoku.firebase.project-id}
spring.security.oauth2.resourceserver.jwt.audiences=${pidoku.firebase.project-id}

# --- Generator job (runs with the "generator" profile, see GeneratorJob) ---
pidoku.generator.pool-size-per-difficulty=50
pidoku.generator.daily-days-ahead=31
# 0 = one puzzle at a time per available processor.
pidoku.generator.parallelism=0
pidoku.generator.timeout=60s

# --- Daily puzzles: one of each of these difficulties every calendar date ---
pidoku.daily.difficulties=easy,medium,hard

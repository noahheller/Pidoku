# The Cloud Run service. Not activated by hand: processAot (pidoku-api/build.gradle) builds the
# Spring AOT code with this profile, and the service turns it on by running with
# -Dspring.aot.enabled=true. Everything here keeps the database off the cold-start path, so a new
# instance doesn't wait on Neon (TLS handshakes, or about a second when Neon is asleep).

# Migrations run once per deploy instead of in every new instance: CI executes the job with the
# "migrate" profile before deploying the service (see .github/workflows/ci.yml). The nightly
# generator job still migrates too.
spring.flyway.enabled=false

# Hibernate neither checks the schema nor reads JDBC metadata at startup, so it opens no connection
# while booting. The integration tests (default profile) still validate entities against the
# migrated schema.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
# Without the metadata, Hibernate picks its dialect from this name instead of asking the database.
spring.jpa.properties.jakarta.persistence.database-product-name=PostgreSQL

# One idle connection is enough at friends scale. Hikari's default fills all 5 right away, and each
# costs a TLS handshake plus a password hash on the single CPU just as the instance starts.
spring.datasource.hikari.minimum-idle=1

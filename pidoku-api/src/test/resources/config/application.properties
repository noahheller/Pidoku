# Test-only additions to src/main/resources/application.properties (Spring Boot reads
# classpath:/config/ after the root, so these win).
#
# The main file requires the database settings, but tests get their database from the
# Testcontainers service connection (see TestcontainersConfiguration), which replaces these.
DATABASE_URL=unused-replaced-by-testcontainers
DATABASE_USER=unused
DATABASE_PASSWORD=unused

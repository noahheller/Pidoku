plugins {
    id 'java-library'
}

// Engine version, stamped on every generated puzzle. Bump it whenever generation or scoring changes,
// so stored puzzles can be traced back to the engine that made them.
version = '1.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

dependencies {
    // Only used by the Main dev harness to dump puzzles as JSON.
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.21.3'

    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Bake the version into engine.properties so PidokuEngine.VERSION can read it at runtime.
processResources {
    inputs.property 'version', project.version
    filesMatching('**/engine.properties') {
        expand(version: project.version)
    }
}

test {
    useJUnitPlatform()
}

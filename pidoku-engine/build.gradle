plugins {
    id 'java-library'
}

// Engine version, stamped on every generated puzzle. Bump it whenever generation or scoring changes,
// so stored puzzles can be traced back to the engine that made them.
version = '1.2.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

dependencies {
    // Only used by the Main dev harness to dump puzzles as JSON.
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.21.3'

    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Bake the version into engine.properties so PidokuEngine.VERSION can read it at runtime.
processResources {
    inputs.property 'version', project.version
    filesMatching('**/engine.properties') {
        expand(version: project.version)
    }
}

test {
    useJUnitPlatform()
}

// Writes the frontend's tutorial puzzle, worded by the engine's MoveExplainer. TutorialExportTest
// fails while the committed file is out of date.
tasks.register('exportTutorial', JavaExec) {
    group = 'pidoku'
    description = 'Writes pidoku-frontend/src/tutorial/tutorial.json from the engine.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.noahheller.pidokuengine.explain.TutorialExport'
    args rootProject.file('pidoku-frontend/src/tutorial/tutorial.json').absolutePath
}

// Rewrites the golden files GoldenTest compares the engine against. Only run it when a change is
// meant to alter generation, scoring, strategies or explanations.
tasks.register('updateGolden', JavaExec) {
    group = 'pidoku'
    description = 'Regenerates src/test/resources/golden from the current engine.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.noahheller.pidokuengine.golden.GoldenExport'
    workingDir = projectDir
}

// Times generation, for before/after comparisons. Not part of build or CI.
// ./gradlew :pidoku-engine:benchmark --args=10   (seeds per profile, default 5)
tasks.register('benchmark', JavaExec) {
    group = 'pidoku'
    description = 'Times puzzle generation and its two solvers.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.noahheller.pidokuengine.bench.GenerationBenchmark'
}
